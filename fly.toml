app = "biblemate"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "biblemate_data"
  destination = "/app/server/data"

[checks]
  [checks.health]
    type = "http"
    port = 3001
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
